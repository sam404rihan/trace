<body>
  <!--
  THESIS: One next step, drawn. Home is a single stage-coloured card with the topic's data structure as the
  picture and one Continue; it refuses the dashboard of lists, stats and every topic at once.
  OWN-WORLD: Clean light ground (dark rendition too); six saturated stage colours painting whole regions;
  generous rounding; chunky buttons with a darker edge that press down; data structures drawn in SVG.
  STORY: A worried beginner sees what to do now, presses Continue, and finds the rest on the roadmap.
  FIRST VIEWPORT: The hero fills the content width in the stage colour: drawing large on one side; topic name,
  next item, stage line, the Continue button on the other; progress and "See the roadmap" under it.
  FORM: User-pinned direction C3 from the brainstorm (warm and illustrated, like Brilliant); no roll. Authority:
  PRODUCT.md "Brand Commitments" and the spec's "What they chose" (docs/superpowers/specs/2026-10-21-calm-home-design.md).
  FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict,
  DESIGN.md, and every shipping raster carrying its provenance
  -->
  <aside class="side" id="side" aria-label="Navigation">
    <div class="side-top">
      <a class="brand" href="#/"><span class="brand-mark" aria-hidden="true"></span>Trace</a>
      <button class="search-btn" id="search-btn" type="button">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <span>Go to anything</span><kbd>Ctrl K</kbd>
      </button>
    </div>
    <nav class="side-nav" id="side-nav"></nav>
    <footer class="side-foot">
      <span class="sandbox" id="sandbox" role="status"><i></i><span>Starting…</span></span>
      <button class="icon-btn" id="theme-btn" type="button" aria-label="Switch light or dark theme" title="Light or dark theme">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg>
      </button>
    </footer>
  </aside>

  <div class="main">
    <header class="bar">
      <button class="icon-btn" id="side-btn" type="button" aria-label="Show or hide the sidebar" title="Sidebar (Ctrl+B)">
        <svg class="icon" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M9.5 4.5v15"/></svg>
      </button>
      <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
    </header>
    <main id="app">
      <div class="page" aria-busy="true" aria-label="Loading">
        <span class="sk sk-hero"></span>
        <span class="sk sk-line" style="width:82%"></span>
        <span class="sk sk-line" style="width:64%"></span>
        <span class="sk sk-btn"></span>
        <div style="margin-top:56px">
          <span class="sk sk-row"></span><span class="sk sk-row"></span><span class="sk sk-row"></span>
          <span class="sk sk-row"></span><span class="sk sk-row"></span><span class="sk sk-row"></span>
        </div>
      </div>
    </main>
  </div>

  <div class="palette-back" id="palette" hidden>
    <div class="palette" role="dialog" aria-label="Go to anything">
      <input id="palette-input" type="text" placeholder="Problems, topics, plans, drills…" autocomplete="off" spellcheck="false" aria-label="Search">
      <ul id="palette-list" role="listbox"></ul>
      <p class="palette-hint"><kbd>↑</kbd> <kbd>↓</kbd> to move, <kbd>Enter</kbd> to open, <kbd>Esc</kbd> to close</p>
    </div>
  </div>
